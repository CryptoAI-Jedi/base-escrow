[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 10_000
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }

[profile.ci]
fuzz = { runs = 1_000 }

[profile.nightly]
fuzz = { runs = 10_000 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base-sepolia = "${RPC_URL}"

[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

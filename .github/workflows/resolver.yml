name: resolver

on:
  push:
    branches: [main]
    paths: ["resolver/**", ".github/workflows/resolver.yml"]
  pull_request:
    paths: ["resolver/**", ".github/workflows/resolver.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resolver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: resolver/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest httpx ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q
